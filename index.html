<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#58cc02">
    <title>Linux & Git Тренажер</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --green: #58cc02;
    --green-dark: #58a700;
    --green-light: #d7ffb8;
    --blue: #1cb0f6;
    --blue-dark: #1899d6;
    --red: #ff4b4b;
    --red-dark: #ea2b2b;
    --red-light: #ffdfe0;
    --yellow: #ffc800;
    --orange: #ff9600;
    --gray-100: #f7f7f7;
    --gray-200: #e5e5e5;
    --gray-300: #d4d4d4;
    --gray-400: #a3a3a3;
    --gray-500: #737373;
    --gray-600: #525252;
    --gray-700: #404040;
    --gray-800: #262626;
    --white: #ffffff;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.15);
    
    /* Safe areas for mobile */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
}

html {
    height: -webkit-fill-available;
}

body {
    background-color: var(--gray-100);
    color: var(--gray-800);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

#app {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    background: var(--white);
    position: relative;
    padding-bottom: var(--safe-bottom);
}

/* Header */
.header {
    background: var(--white);
    border-bottom: 2px solid var(--gray-200);
    padding: calc(12px + var(--safe-top)) 16px 12px;
    padding-left: calc(16px + var(--safe-left));
    padding-right: calc(16px + var(--safe-right));
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-content {
    display: flex;
    align-items: center;
    gap: 12px;
}

.icon-btn {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 12px;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, background 0.1s ease;
}

.icon-btn:active {
    transform: scale(0.9);
}

.icon-btn:hover {
    background: var(--gray-100);
}

.progress-container {
    flex: 1;
}

.progress-bar {
    height: 20px;
    background: var(--gray-200);
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 10px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
}

.hearts {
    font-size: 22px;
    color: var(--red);
}

/* Screens */
.screen {
    display: none;
    min-height: calc(100vh - 72px - var(--safe-top) - var(--safe-bottom));
}

.screen.active {
    display: flex;
    flex-direction: column;
}

.container {
    padding: 20px 20px;
    padding-left: calc(20px + var(--safe-left));
    padding-right: calc(20px + var(--safe-right));
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Main Menu */
.title {
    font-size: clamp(28px, 7vw, 36px);
    font-weight: 900;
    text-align: center;
    margin-bottom: 8px;
    color: var(--gray-800);
    letter-spacing: -0.5px;
}

.subtitle {
    text-align: center;
    color: var(--gray-500);
    font-size: clamp(14px, 4vw, 18px);
    margin-bottom: 28px;
}

.menu-grid {
    display: grid;
    gap: 14px;
    margin-bottom: 32px;
}

.mode-card {
    background: var(--white);
    border: 2px solid var(--gray-200);
    border-bottom: 5px solid var(--gray-300);
    border-radius: 20px;
    padding: 24px 20px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    min-height: 120px;
}

.mode-card:active {
    border-bottom-width: 2px;
    transform: translateY(3px);
    background: var(--gray-50);
}

.mode-icon {
    font-size: clamp(40px, 10vw, 56px);
    margin-bottom: 10px;
}

.mode-card h2 {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 900;
    margin-bottom: 6px;
    color: var(--gray-800);
}

.mode-card p {
    color: var(--gray-500);
    font-size: clamp(14px, 3.5vw, 17px);
}

/* Stats */
.stats {
    display: flex;
    justify-content: space-around;
    padding: 20px;
    background: var(--gray-100);
    border-radius: 20px;
    margin-top: auto;
}

.stat {
    text-align: center;
}

.stat-value {
    display: block;
    font-size: clamp(24px, 7vw, 32px);
    font-weight: 900;
    color: var(--green);
}

.stat-label {
    font-size: 13px;
    color: var(--gray-500);
    font-weight: 600;
}

/* Back Button */
.back-btn {
    background: none;
    border: none;
    font-size: 17px;
    color: var(--gray-600);
    cursor: pointer;
    padding: 10px 4px;
    margin-bottom: 12px;
    font-weight: 700;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
}

.back-btn:active {
    color: var(--gray-800);
}

/* Cards Mode */
.card-counter {
    text-align: center;
    color: var(--gray-500);
    font-weight: 700;
    margin-bottom: 16px;
    font-size: 15px;
}

.flashcard {
    height: clamp(260px, 50vh, 340px);
    perspective: 1000px;
    cursor: pointer;
    margin-bottom: 24px;
}

.flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
}

.flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
}

.flashcard-front, .flashcard-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px solid var(--gray-200);
    border-bottom: 5px solid var(--gray-300);
    background: var(--white);
}

.flashcard-back {
    transform: rotateY(180deg);
    background: var(--green-light);
    border-color: var(--green);
    border-bottom-color: var(--green-dark);
}

.card-category {
    display: inline-block;
    background: var(--blue);
    color: white;
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 20px;
}

.card-command {
    font-family: 'Courier New', 'SF Mono', Monaco, monospace;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: bold;
    background: var(--gray-800);
    color: var(--green-light);
    padding: 16px 24px;
    border-radius: 14px;
    margin-bottom: 20px;
    word-break: break-all;
    max-width: 100%;
}

.card-hint {
    color: var(--gray-400);
    font-size: 14px;
    margin-top: auto;
    font-weight: 600;
}

.card-description {
    font-size: clamp(16px, 4vw, 20px);
    line-height: 1.5;
    margin-bottom: 20px;
    color: var(--gray-800);
    font-weight: 600;
}

.card-example {
    font-family: 'Courier New', 'SF Mono', Monaco, monospace;
    background: var(--gray-800);
    color: var(--white);
    padding: 14px 16px;
    border-radius: 10px;
    font-size: clamp(12px, 3.2vw, 15px);
    width: 100%;
    white-space: pre-wrap;
    word-break: break-all;
    text-align: left;
    line-height: 1.6;
}

.card-controls {
    display: flex;
    gap: 12px;
    margin-top: auto;
}

/* Buttons */
.btn-primary {
    background: var(--green);
    color: white;
    border: none;
    border-bottom: 5px solid var(--green-dark);
    border-radius: 16px;
    padding: 16px 24px;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s ease;
    flex: 1;
    min-height: 52px;
}

.btn-primary:active {
    border-bottom-width: 2px;
    transform: translateY(3px);
}

.btn-secondary {
    background: var(--white);
    color: var(--gray-700);
    border: 2px solid var(--gray-200);
    border-bottom: 5px solid var(--gray-300);
    border-radius: 16px;
    padding: 16px 20px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    flex: 1;
    min-height: 52px;
}

.btn-secondary:active {
    border-bottom-width: 2px;
    transform: translateY(3px);
}

.btn-full {
    width: 100%;
}

/* Question Header */
.question-header {
    margin-bottom: 24px;
}

.question-header h2 {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    color: var(--gray-800);
    line-height: 1.3;
}

/* Command Preview */
.command-preview {
    background: var(--gray-800);
    color: var(--white);
    padding: 20px 16px;
    border-radius: 16px;
    font-family: 'Courier New', 'SF Mono', Monaco, monospace;
    font-size: clamp(16px, 4vw, 22px);
    margin-bottom: 20px;
    min-height: 90px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    line-height: 2;
    align-content: center;
}

.blank {
    display: inline-block;
    min-width: 80px;
    height: 28px;
    border-bottom: 3px dashed var(--white);
    margin: 0 4px;
}

.answer-area {
    min-height: 50px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--gray-200);
}

.selected-words {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.word-chip {
    background: var(--white);
    border: 2px solid var(--gray-300);
    border-bottom: 4px solid var(--gray-400);
    border-radius: 12px;
    padding: 12px 18px;
    font-size: clamp(15px, 4vw, 18px);
    font-family: 'Courier New', 'SF Mono', Monaco, monospace;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.1s ease;
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.word-chip:active {
    transform: scale(0.95);
}

.word-chip:hover {
    background: var(--gray-50);
}

.word-chip.correct {
    background: var(--green);
    color: white;
    border-color: var(--green-dark);
    border-bottom-color: #3f8a00;
}

.word-chip.wrong {
    background: var(--red);
    color: white;
    border-color: var(--red-dark);
    border-bottom-color: #c11f1f;
}

.word-chip.used {
    opacity: 0.25;
    pointer-events: none;
}

.options-area {
    margin-bottom: 20px;
    flex: 1;
}

.word-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-content: flex-start;
}

/* Test Options */
.test-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
    flex: 1;
}

.test-option {
    background: var(--white);
    border: 2px solid var(--gray-200);
    border-bottom: 4px solid var(--gray-300);
    border-radius: 16px;
    padding: 18px 20px;
    font-size: clamp(16px, 4vw, 19px);
    cursor: pointer;
    text-align: left;
    font-family: 'Courier New', 'SF Mono', Monaco, monospace;
    font-weight: 700;
    transition: all 0.1s ease;
    min-height: 56px;
    display: flex;
    align-items: center;
}

.test-option:active {
    transform: scale(0.98);
}

.test-option.selected {
    border-color: var(--blue);
    background: #ddf4ff;
    border-bottom-color: var(--blue-dark);
}

.test-option.correct {
    border-color: var(--green);
    background: var(--green-light);
    border-bottom-color: var(--green-dark);
}

.test-option.wrong {
    border-color: var(--red);
    background: var(--red-light);
    border-bottom-color: var(--red-dark);
}

/* Action Buttons */
.action-buttons {
    display: flex;
    gap: 12px;
    margin-top: auto;
    padding-top: 12px;
    padding-bottom: var(--safe-bottom);
}

.btn-check {
    flex: 1;
    background: var(--gray-200);
    color: var(--gray-400);
    border: none;
    border-bottom: 5px solid var(--gray-300);
    border-radius: 16px;
    padding: 16px 24px;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: not-allowed;
    transition: all 0.15s ease;
    min-height: 56px;
}

.btn-check.active {
    background: var(--green);
    color: white;
    border-bottom-color: var(--green-dark);
    cursor: pointer;
}

.btn-check.active:active {
    border-bottom-width: 2px;
    transform: translateY(3px);
}

.btn-skip {
    background: var(--white);
    color: var(--gray-500);
    border: 2px solid var(--gray-200);
    border-bottom: 4px solid var(--gray-300);
    border-radius: 16px;
    padding: 16px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    min-height: 56px;
    transition: all 0.15s ease;
}

.btn-skip:active {
    border-bottom-width: 2px;
    transform: translateY(2px);
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: var(--white);
    border-radius: 24px 24px 0 0;
    padding: 32px 24px;
    padding-bottom: calc(32px + var(--safe-bottom));
    width: 100%;
    max-width: 600px;
    text-align: center;
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.modal-content.correct {
    background: var(--green-light);
}

.modal-content.wrong {
    background: var(--red-light);
}

.result-icon {
    font-size: clamp(72px, 20vw, 96px);
    margin-bottom: 12px;
    animation: bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes bounce {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

.modal-content h2 {
    font-size: clamp(24px, 7vw, 32px);
    font-weight: 900;
    margin-bottom: 10px;
    color: var(--gray-800);
}

.modal-content p {
    font-size: clamp(15px, 4vw, 18px);
    color: var(--gray-700);
    margin-bottom: 20px;
    line-height: 1.5;
}

.lesson-complete {
    background: var(--white) !important;
    border-radius: 24px 24px 0 0;
}

.complete-stats {
    background: var(--gray-100);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-around;
    font-weight: 700;
    font-size: 16px;
}

/* Text token in command preview */
.cmd-text {
    color: var(--white);
    white-space: nowrap;
}

.cmd-blank-slot {
    display: inline-flex;
    align-items: flex-end;
    justify-content: center;
    min-width: 80px;
    height: 40px;
    border-bottom: 3px solid var(--white);
    margin: 0 6px;
    vertical-align: bottom;
    position: relative;
    padding-bottom: 2px;
}

.cmd-blank-slot.has-word {
    border-bottom-color: var(--green);
}

.cmd-blank-slot .word-chip {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font-size: clamp(14px, 3.5vw, 17px);
    padding: 8px 14px;
    min-height: 40px;
    white-space: nowrap;
}

.cmd-blank-slot .word-chip:active {
    transform: translateX(-50%) scale(0.95);
}

/* Медиа-запросы для совсем маленьких экранов */
@media (max-width: 360px) {
    .container {
        padding: 16px 14px;
    }
    
    .header {
        padding: calc(10px + var(--safe-top)) 12px 10px;
    }
    
    .command-preview {
        padding: 16px 12px;
    }
    
    .word-chip {
        padding: 10px 14px;
    }
}

/* Анимация дрожания при ошибке */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
}

.shake {
    animation: shake 0.4s ease;
}

/* Отключение выделения текста для кнопок */
button {
    -webkit-user-select: none;
    user-select: none;
}

</style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <button id="menuBtn" class="icon-btn">☰</button>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>
                <div class="hearts">
                    <span id="hearts">❤❤❤❤❤</span>
                </div>
                <button id="soundBtn" class="icon-btn" onclick="toggleSound()" title="Звук">🔊</button>
            </div>
        </header>

        <!-- Main Menu -->
        <div id="mainMenu" class="screen active">
            <div class="container">
                <h1 class="title">🐧 Linux & Git Тренажер</h1>
                <p class="subtitle">Учи команды терминала шаг за шагом</p>
                
                <div class="menu-grid">
                    <button class="mode-card" onclick="startMode('cards')">
                        <div class="mode-icon">📇</div>
                        <h2>Карточки</h2>
                        <p>Изучай команды и их описание</p>
                    </button>
                    
                    <button class="mode-card" onclick="startMode('test')">
                        <div class="mode-icon">📝</div>
                        <h2>Тест</h2>
                        <p>Проверь свои знания</p>
                    </button>
                    
                    <button class="mode-card" onclick="startMode('trainer')">
                        <div class="mode-icon">⌨️</div>
                        <h2>Тренажер</h2>
                        <p>Собирай команды как в Duolingo</p>
                    </button>
                </div>

                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="totalLearned">0</span>
                        <span class="stat-label">Изучено</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="streak">0</span>
                        <span class="stat-label">Дней подряд</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="xp">0</span>
                        <span class="stat-label">XP</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cards Mode -->
        <div id="cardsScreen" class="screen">
            <div class="container">
                <button class="back-btn" onclick="goHome()">← Назад</button>
                
                <div class="card-counter">
                    <span id="cardCurrent">1</span> / <span id="cardTotal">0</span>
                </div>

                <div id="flashcard" class="flashcard" onclick="flipCard()">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <div class="card-category" id="cardCategory"></div>
                            <div class="card-command" id="cardCommand"></div>
                            <div class="card-hint">Нажми, чтобы увидеть ответ</div>
                        </div>
                        <div class="flashcard-back">
                            <div class="card-description" id="cardDescription"></div>
                            <div class="card-example" id="cardExample"></div>
                        </div>
                    </div>
                </div>

                <div class="card-controls">
                    <button class="btn-secondary" onclick="prevCard()">← Предыдущая</button>
                    <button class="btn-primary" onclick="nextCard()">Знаю →</button>
                </div>
            </div>
        </div>

        <!-- Trainer Mode (Duolingo-style) -->
        <div id="trainerScreen" class="screen">
            <div class="container">
                <button class="back-btn" onclick="goHome()">← Назад</button>
                
                <div class="question-header">
                    <h2 id="trainerQuestion">Заполните пропуск в команде:</h2>
                </div>

                <div id="commandPreview" class="command-preview">
                    <!-- Command with blanks will be inserted here -->
                </div>

                <div class="answer-area">
                    <div id="selectedWords" class="selected-words">
                        <!-- Selected words appear here -->
                    </div>
                </div>

                <div class="options-area">
                    <div id="wordOptions" class="word-options">
                        <!-- Word options appear here -->
                    </div>
                </div>

                <div class="action-buttons">

// Звуковое сопровождение как в Duolingo через Web Audio API
let audioCtx = null;
let soundEnabled = localStorage.getItem('linuxTrainerSound') !== 'off';

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    localStorage.setItem('linuxTrainerSound', soundEnabled ? 'on' : 'off');
    
    const btn = document.getElementById('soundBtn');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    
    if (soundEnabled) {
        initAudio();
        playClick();
    }
}

// Инициализируем кнопку звука после загрузки
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('soundBtn');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
});

// Вспомогательная функция для воспроизведения тона
function playTone(frequency, startTime, duration, volume = 0.3, type = 'sine', attack = 0.01, release = 0.1) {
    if (!soundEnabled || !audioCtx) return;
    
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, startTime);
    
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(volume, startTime + attack);
    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration + release);
    
    oscillator.start(startTime);
    oscillator.stop(startTime + duration + release);
}

// Короткий звук нажатия на кнопку/слово
function playClick() {
    if (!soundEnabled) return;
    initAudio();
    
    const now = audioCtx.currentTime;
    playTone(800, now, 0.05, 0.15, 'sine', 0.005, 0.05);
}

}

    setTimeout(() => playTone(1046.50, now + 0.3, 0.3, 0.25, 'triangle', 0.02, 0.3), 300);
}

// Звук завершения урока (фанфары)
function playLessonComplete() {
    if (!soundEnabled) return;
    initAudio();
    
    const now = audioCtx.currentTime;
    
    // Победная мелодия
    const melody = [
        { note: 523.25, delay: 0, dur: 0.15 },    // C5
        { note: 659.25, delay: 0.15, dur: 0.15 }, // E5
        { note: 783.99, delay: 0.3, dur: 0.15 },  // G5
        { note: 1046.50, delay: 0.45, dur: 0.4 }  // C6
    ];
    
    melody.forEach(m => {
        playTone(m.note, now + m.delay, m.dur, 0.3, 'triangle', 0.03, 0.2);
    });
}

    selectedBlank: 0,
    blanksState: [],
    usedOptions: [],
    
    // Test mode
    currentTestQuestion: 0,
    testQuestions: [],
    selectedTestOption: null,
    
    // Session stats
    sessionCorrect: 0,
    sessionWrong: 0,
    sessionXP: 0,
    questionsPerLesson: 10
};

// DOM Elements
const screens = ['mainMenu', 'cardsScreen', 'trainerScreen', 'testScreen'];

// Показать экран
function showScreen(screenId) {
    screens.forEach(id => {
        document.getElementById(id).classList.remove('active');
    });
    document.getElementById(screenId).classList.add('active');
    // Скролл наверх
    window.scrollTo(0, 0);
}

// Обновить статистику в меню
function updateStats() {
    document.getElementById('totalLearned').textContent = state.totalLearned;
    document.getElementById('streak').textContent = state.streak;
    document.getElementById('xp').textContent = state.xp;
}

// Обновить сердца с анимацией
function updateHearts() {
    document.getElementById('hearts').textContent = '❤'.repeat(state.hearts) + '🖤'.repeat(5 - state.hearts);
}

// Обновить прогресс бар
function updateProgress(current, total) {
    const percent = Math.min((current / total) * 100, 100);
    document.getElementById('progressFill').style.width = percent + '%';
}

// На главную
function goHome() {
    playClick();
    showScreen('mainMenu');
    state.currentMode = null;
    updateProgress(0, 1);
    updateStats();
    document.getElementById('resultModal').classList.remove('active');
    document.getElementById('completeModal').classList.remove('active');
}

// Перемешать массив
function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

// Запустить режим
function startMode(mode) {
    playClick();
    state.currentMode = mode;
    state.hearts = 5;
    state.sessionCorrect = 0;
    state.sessionWrong = 0;
    state.sessionXP = 0;
    updateHearts();
    
    if (mode === 'cards') {
        state.currentCard = 0;
        state.isFlipped = false;
        document.getElementById('cardTotal').textContent = ALL_COMMANDS.length;
        showCard();
        showScreen('cardsScreen');
        updateProgress(1, ALL_COMMANDS.length);
    } else if (mode === 'trainer') {
        state.trainerQuestions = shuffleArray(TRAINER_QUESTIONS).slice(0, state.questionsPerLesson);
        state.currentTrainerQuestion = 0;
        showTrainerQuestion();
        showScreen('trainerScreen');
        updateProgress(0, state.questionsPerLesson);
    } else if (mode === 'test') {
        state.testQuestions = shuffleArray(TEST_QUESTIONS).slice(0, state.questionsPerLesson);
        state.currentTestQuestion = 0;
        state.selectedTestOption = null;
        showTestQuestion();
        showScreen('testScreen');
        updateProgress(0, state.questionsPerLesson);
    }
}

// ========== CARDS MODE ==========
function showCard() {
    const card = ALL_COMMANDS[state.currentCard];
    document.getElementById('cardCategory').textContent = card.category;
    document.getElementById('cardCommand').textContent = card.command;
    document.getElementById('cardDescription').textContent = card.description;
    document.getElementById('cardExample').textContent = card.example;
    
    document.getElementById('cardCurrent').textContent = state.currentCard + 1;
    
    const flashcard = document.getElementById('flashcard');
    flashcard.classList.remove('flipped');
    state.isFlipped = false;
}

function flipCard() {
    playFlip();
    const flashcard = document.getElementById('flashcard');
    flashcard.classList.toggle('flipped');
    state.isFlipped = !state.isFlipped;
}

function nextCard() {
    playClick();
    state.totalLearned++;
    localStorage.setItem('linuxTrainerLearned', state.totalLearned.toString());
    state.sessionXP += 2;
    state.xp += 2;
    localStorage.setItem('linuxTrainerXP', state.xp.toString());
    
    if (state.currentCard < ALL_COMMANDS.length - 1) {
        state.currentCard++;
        showCard();
        updateProgress(state.currentCard + 1, ALL_COMMANDS.length);
    } else {
        showLessonComplete();
    }
}

function prevCard() {
    playClick();
    if (state.currentCard > 0) {
        state.currentCard--;
        showCard();
        updateProgress(state.currentCard + 1, ALL_COMMANDS.length);
    }
}

// ========== TRAINER MODE (Duolingo-style) ==========
function showTrainerQuestion() {
    state.blanksState = [];
    state.usedOptions = [];
    document.getElementById('checkBtn').classList.remove('active');
    document.getElementById('checkBtn').disabled = true;
    
    const q = state.trainerQuestions[state.currentTrainerQuestion];
    document.getElementById('trainerQuestion').textContent = q.question || 'Соберите команду:';
    
    let commandParts;
    
    if (q.command && !q.fullCommand) {
        const cmdParts = q.command.split(' ');
        const blankIndex = q.type === 'git' ? 1 : 0;
        
        commandParts = cmdParts.map((word, i) => {
            if (i === blankIndex) {
                state.blanksState.push(null);
                return { type: 'blank', index: 0 };
            }
            return { type: 'text', word: word };
        });
        
        const correctWord = cmdParts[blankIndex];
        const otherOptions = [];
        const allWords = ALL_COMMANDS.flatMap(c => c.command.split(' '));
        while (otherOptions.length < 4) {
            const w = allWords[Math.floor(Math.random() * allWords.length)];
            if (w !== correctWord && !otherOptions.includes(w) && w !== 'git') {
                otherOptions.push(w);
            }
        }
        q.fullCommand = q.command;
        q.options = shuffleArray([correctWord, ...otherOptions]);
        q.correctAnswer = correctWord;
        q.blanks = [blankIndex];
    } else {
        const cmdWords = q.fullCommand.split(' ');
        commandParts = cmdWords.map((word, i) => {
            if (q.blanks && q.blanks.includes(i)) {
                state.blanksState.push(null);
                return { type: 'blank', index: state.blanksState.length - 1 };
            }
            return { type: 'text', word: word };
        });
        q.correctAnswer = q.fullCommand.split(' ').filter((w, i) => q.blanks.includes(i));
    }
    
    const preview = document.getElementById('commandPreview');
    preview.innerHTML = '';
    commandParts.forEach(part => {
        if (part.type === 'text') {
            const span = document.createElement('span');
            span.className = 'cmd-text';
            span.textContent = part.word;
            preview.appendChild(span);
        } else {
            const blank = document.createElement('div');
            blank.className = 'cmd-blank-slot';
            blank.id = `blank-slot-${part.index}`;
            blank.onclick = () => removeWordFromBlank(part.index);
            preview.appendChild(blank);
        }
        preview.appendChild(document.createTextNode(' '));
    });
    
    document.getElementById('selectedWords').innerHTML = '';
    
    const optionsContainer = document.getElementById('wordOptions');
    optionsContainer.innerHTML = '';
    const shuffledOptions = shuffleArray(q.options);
    shuffledOptions.forEach((word, i) => {
        const btn = document.createElement('button');
        btn.className = 'word-chip';
        btn.textContent = word;
        btn.dataset.word = word;
        btn.onclick = () => selectWord(word, btn);
        optionsContainer.appendChild(btn);
    });
}

function selectWord(word, btnElement) {
    const emptyBlankIndex = state.blanksState.findIndex(b => b === null);
    if (emptyBlankIndex === -1) return;
    
    playSelect();
    
    state.blanksState[emptyBlankIndex] = word;
    btnElement.classList.add('used');
    
    const slot = document.getElementById(`blank-slot-${emptyBlankIndex}`);
    slot.classList.add('has-word');
    slot.innerHTML = '';
    const chip = document.createElement('span');
    chip.className = 'word-chip';
    chip.textContent = word;
    slot.appendChild(chip);
    
    if (state.blanksState.every(b => b !== null)) {
        document.getElementById('checkBtn').classList.add('active');
        document.getElementById('checkBtn').disabled = false;
    }
}

function removeWordFromBlank(blankIndex) {
    const word = state.blanksState[blankIndex];
    if (word === null) return;
    
    playClick();
    
    state.blanksState[blankIndex] = null;
    
    const slot = document.getElementById(`blank-slot-${blankIndex}`);
    slot.classList.remove('has-word');
    slot.innerHTML = '';
    
    const options = document.querySelectorAll('.word-options .word-chip');
    options.forEach(btn => {
        if (btn.dataset.word === word && btn.classList.contains('used')) {
            btn.classList.remove('used');
        }
    });
    
    document.getElementById('checkBtn').classList.remove('active');
    document.getElementById('checkBtn').disabled = true;
}

function checkAnswer() {
    playClick();
    
    const q = state.trainerQuestions[state.currentTrainerQuestion];
    const correctWords = q.fullCommand.split(' ').filter((w, i) => q.blanks.includes(i));
    
    let isCorrect = true;
    for (let i = 0; i < correctWords.length; i++) {
        if (state.blanksState[i] !== correctWords[i]) {
            isCorrect = false;
            break;
        }
    }
    
    if (isCorrect) {
        state.sessionCorrect++;
        state.sessionXP += 10;
        playCorrect();
        showResult(true, 'Правильно! 👏', q.description || 'Отличная работа!');
    } else {
        state.sessionWrong++;
        state.hearts--;
        updateHearts();
        playWrong();
        playHeartLost();
        
        // Добавляем тряску
        const preview = document.getElementById('commandPreview');
        preview.classList.add('shake');
        setTimeout(() => preview.classList.remove('shake'), 500);
        
        const correctCommand = q.fullCommand;
        const msg = `Правильная команда: <strong style="font-family: monospace; font-size: 0.9em">${correctCommand}</strong><br><br>${q.description || ''}`;
        
        if (state.hearts <= 0) {
            setTimeout(() => showLessonComplete(), 2200);
        }
        
        showResult(false, 'Неправильно 😔', msg);
    }
}

function skipQuestion() {
    playSkip();
    state.hearts--;
    updateHearts();
    playHeartLost();
    const q = state.trainerQuestions[state.currentTrainerQuestion];
    const msg = `Команда: <strong style="font-family: monospace; font-size: 0.9em">${q.fullCommand}</strong><br><br>${q.description || ''}`;
    state.sessionWrong++;
    
    if (state.hearts <= 0) {
        showResult(false, 'Пропуск', msg);
        setTimeout(() => showLessonComplete(), 2200);
    } else {
        showResult(false, 'Пропущено', msg);
    }
}

// ========== TEST MODE ==========
function showTestQuestion() {
    state.selectedTestOption = null;
    document.getElementById('testCheckBtn').classList.remove('active');
    document.getElementById('testCheckBtn').disabled = true;
    
    const q = state.testQuestions[state.currentTestQuestion];
    document.getElementById('testQuestion').textContent = q.question;
    
    const optionsContainer = document.getElementById('testOptions');
    optionsContainer.innerHTML = '';
    
    q.options.forEach((option, i) => {
        const btn = document.createElement('button');
        btn.className = 'test-option';
        btn.textContent = option;
        btn.onclick = () => selectTestOption(i, btn);
        optionsContainer.appendChild(btn);
    });
}

function selectTestOption(index, btnElement) {
    playSelect();
    state.selectedTestOption = index;
    
    document.querySelectorAll('.test-option').forEach(btn => {
        btn.classList.remove('selected');
    });
    btnElement.classList.add('selected');
    
    document.getElementById('testCheckBtn').classList.add('active');
    document.getElementById('testCheckBtn').disabled = false;
}

function checkTestAnswer() {
    playClick();
    const q = state.testQuestions[state.currentTestQuestion];
    const isCorrect = state.selectedTestOption === q.correct;
    
    const options = document.querySelectorAll('.test-option');
    
    if (isCorrect) {
        options[state.selectedTestOption].classList.add('correct');
        state.sessionCorrect++;
        state.sessionXP += 10;
        playCorrect();
        showResult(true, 'Правильно! 🎉', q.explanation);
    } else {
        options[state.selectedTestOption].classList.add('wrong');
        options[q.correct].classList.add('correct');
        state.sessionWrong++;
        state.hearts--;
        updateHearts();
        playWrong();
        playHeartLost();
        
        // Тряска
        const testOpts = document.getElementById('testOptions');
        testOpts.classList.add('shake');
        setTimeout(() => testOpts.classList.remove('shake'), 500);
        
        if (state.hearts <= 0) {
            setTimeout(() => showLessonComplete(), 2700);
        }
        
        showResult(false, 'Неправильно', q.explanation);
    }
}

function skipTestQuestion() {
    playSkip();
    state.hearts--;
    updateHearts();
    playHeartLost();
    const q = state.testQuestions[state.currentTestQuestion];
    state.sessionWrong++;
    
    const options = document.querySelectorAll('.test-option');
    options[q.correct].classList.add('correct');
    
    if (state.hearts <= 0) {
        showResult(false, 'Пропуск', q.explanation);
        setTimeout(() => showLessonComplete(), 2200);
    } else {
        showResult(false, 'Пропущено', q.explanation);
    }
}

// ========== RESULTS ==========
function showResult(isCorrect, title, message) {
    const modal = document.getElementById('resultModal');
    const content = document.getElementById('resultContent');
    
    content.className = 'modal-content ' + (isCorrect ? 'correct' : 'wrong');
    document.getElementById('resultIcon').textContent = isCorrect ? '🎉' : '😢';
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMessage').innerHTML = message;
    
    setTimeout(() => {
        modal.classList.add('active');
    }, isCorrect ? 200 : 600);
}

function nextQuestion() {
    playClick();
    document.getElementById('resultModal').classList.remove('active');
    
    if (state.hearts <= 0) {
        showLessonComplete();
        return;
    }
    
    if (state.currentMode === 'trainer') {
        state.currentTrainerQuestion++;
        if (state.currentTrainerQuestion >= state.trainerQuestions.length) {
            showLessonComplete();
        } else {
            showTrainerQuestion();
            updateProgress(state.currentTrainerQuestion, state.questionsPerLesson);
        }
    } else if (state.currentMode === 'test') {
        state.currentTestQuestion++;
        if (state.currentTestQuestion >= state.testQuestions.length) {
            showLessonComplete();
        } else {
            showTestQuestion();
            updateProgress(state.currentTestQuestion, state.questionsPerLesson);
        }
    }
}

function showLessonComplete() {
    state.xp += state.sessionXP;
    localStorage.setItem('linuxTrainerXP', state.xp.toString());
    
    document.getElementById('earnedXP').textContent = state.sessionXP;
    document.getElementById('correctCount').textContent = state.sessionCorrect;
    document.getElementById('wrongCount').textContent = state.sessionWrong;
    
    document.getElementById('resultModal').classList.remove('active');
    
    setTimeout(() => {
        playLessonComplete();
        document.getElementById('completeModal').classList.add('active');
    }, 300);
    
    updateProgress(1, 1);
}

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
    updateStats();
    updateHearts();
    updateProgress(0, 1);
    
    // Инициализируем аудио при первом тапе/клике (требование мобильных браузеров)
    const initAudioOnFirstInteraction = () => {
        initAudio();
        document.removeEventListener('touchstart', initAudioOnFirstInteraction);
        document.removeEventListener('click', initAudioOnFirstInteraction);
    };
    document.addEventListener('touchstart', initAudioOnFirstInteraction, { once: true });
    document.addEventListener('click', initAudioOnFirstInteraction, { once: true });
});

</script>
